<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Immersion Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
</head>
<body>

  <!-- ================= LOGIN / SIGNUP SCREEN ================= -->
  <div id="auth-screen" class="screen active">
    <div class="glass-card auth-card">
      <h1>Work Immersion</h1>
      <p class="subtitle">All-in-One Portal</p>

      <div class="tabs">
        <button id="tab-login" class="tab active" onclick="switchAuthTab('login')">Login</button>
        <button id="tab-signup" class="tab" onclick="switchAuthTab('signup')">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label>LRN</label>
          <input type="text" id="login-lrn" placeholder="Enter your LRN" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-primary">Log In</button>
        <p id="login-error" class="error-msg"></p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signup-form" class="auth-form" onsubmit="handleSignup(event)">
        <div class="input-group">
          <label>LRN</label>
          <input type="text" id="signup-lrn" placeholder="Enter your LRN" required>
        </div>
        <div class="row">
          <div class="input-group">
            <label>Last Name</label>
            <input type="text" id="signup-lastname" placeholder="Last Name" required>
          </div>
          <div class="input-group">
            <label>First Name</label>
            <input type="text" id="signup-firstname" placeholder="First Name" required>
          </div>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="Create a password" required>
        </div>
        <div class="input-group">
          <label>Field</label>
          <select id="signup-field" onchange="updateCourses()" required>
            <option value="">Select Field</option>
            <option value="Health">Health / Medical</option>
            <option value="Education">Education</option>
            <option value="Agriculture">Agriculture</option>
            <option value="Business">Business / Management</option>
            <option value="Engineering/IT">Engineering / IT</option>
          </select>
        </div>
        <div class="input-group">
          <label>Course</label>
          <select id="signup-course" required>
            <option value="">Select Field First</option>
          </select>
        </div>
        <div class="input-group">
          <label>Deployment Area</label>
          <select id="signup-area" required>
            <option value="">Select Course First</option>
          </select>
        </div>
        <div class="input-group" id="school-group" style="display: none;">
          <label>School</label>
          <select id="signup-school">
            <option value="">Select School</option>
            <option value="San Pedro Elementary School">San Pedro Elementary School</option>
            <option value="Iba Elementary School">Iba Elementary School</option>
            <option value="Iba High School">Iba High School</option>
            <option value="Sula Elementary School">Sula Elementary School</option>
            <option value="Sta. Cruz Elementary School">Sta. Cruz Elementary School</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Create Account</button>
        <p id="signup-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <!-- ================= STUDENT DASHBOARD SCREEN ================= -->
  <div id="dashboard-screen" class="screen">
    <div class="glass-card dashboard-card">
      <div class="dashboard-header">
        <h2>Welcome, <span id="student-name">Student</span>!</h2>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
      
      <div class="tabs dashboard-tabs">
        <button class="tab active" onclick="switchDashTab('time')">Time & Attendance</button>
        <button class="tab" onclick="switchDashTab('diary')">Daily Diary</button>
        <button class="tab" onclick="switchDashTab('upload')">Requirements</button>
      </div>

      <!-- TAB 1: TIME IN/OUT -->
      <div id="dash-time" class="dash-content active">
        <h3>Log Your Attendance</h3>
        <div class="timer-display" id="current-datetime">--:--:--</div>
        <div class="button-row">
          <button class="btn-success" id="btn-timein" onclick="timeIn()">Time In</button>
          <button class="btn-danger" id="btn-timeout" onclick="timeOut()">Time Out</button>
        </div>
        <div class="summary-box">
          <h4>Your Total Hours</h4>
          <p class="total-hours" id="total-hours">0.00 hrs</p>
        </div>
        <h4>Recent Logs</h4>
        <ul id="attendance-list" class="log-list"></ul>
      </div>

      <!-- TAB 2: DAILY DIARY -->
      <div id="dash-diary" class="dash-content">
        <h3>Daily Diary</h3>
        <div class="input-group">
          <label>Day Number (1-10)</label>
          <input type="number" id="diary-day" min="1" max="10" required>
        </div>
        <div class="input-group">
          <label>Entry Text</label>
          <textarea id="diary-text" rows="4" placeholder="What did you do today?"></textarea>
        </div>
        <div class="input-group">
          <label>Upload Pictures (Min 2)</label>
          <input type="file" id="diary-images" accept="image/*" multiple onchange="previewDiaryImages(event)">
          <div id="diary-preview" class="image-preview"></div>
        </div>
        <button class="btn-primary" onclick="saveDiary()">Save Diary Entry</button>
        <button class="btn-secondary" onclick="generateWordDoc()">Download as Word</button>
        <ul id="diary-list" class="log-list"></ul>
      </div>

      <!-- TAB 3: REQUIREMENTS UPLOAD -->
      <div id="dash-upload" class="dash-content">
        <h3>Upload Requirements</h3>
        <p class="note">Strictly PDF format only.</p>
        <div class="input-group">
          <input type="file" id="req-file" accept=".pdf" onchange="validatePDF(event)">
        </div>
        <button class="btn-primary" onclick="uploadRequirement()">Upload PDF</button>
        <ul id="requirements-list" class="log-list"></ul>
      </div>

    </div>
  </div>

    <script src="app.js"></script>
  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('ServiceWorker registered:', registration);
          })
          .catch(error => {
            console.log('ServiceWorker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
