<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Portal - Work Immersion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="teacher-auth" class="screen active">
    <div class="glass-card auth-card">
      <h1>Teacher Portal</h1>
      <p class="subtitle">Enter password to access</p>
      <div class="input-group">
        <input type="password" id="teacher-pass" placeholder="Teacher Password">
      </div>
      <button class="btn-primary" onclick="loginTeacher()">Access Dashboard</button>
      <p id="teacher-error" class="error-msg"></p>
    </div>
  </div>

  <div id="teacher-dash" class="screen">
    <div class="glass-card dashboard-card" style="max-width: 1000px;">
      <div class="dashboard-header">
        <h2>Teacher Dashboard</h2>
        <button class="btn-logout" onclick="logoutTeacher()">Logout</button>
      </div>

      <div class="tabs dashboard-tabs">
        <button class="tab active" onclick="switchTeachTab('attendance')">Attendance</button>
        <button class="tab" onclick="switchTeachTab('scores')">Grade Diary</button>
        <button class="tab" onclick="switchTeachTab('announce')">Announcement</button>
      </div>

      <!-- ATTENDANCE TAB -->
      <div id="teach-attendance" class="dash-content active">
        <div class="row" style="margin-bottom: 10px; align-items: flex-end;">
          <div class="input-group" style="flex: 2;">
            <label>Search Student (Name or LRN)</label>
            <input type="text" id="search-student" oninput="renderStudentList()" placeholder="Type to search...">
          </div>
          <div class="input-group" style="flex: 1;">
            <label>Filter by Section</label>
            <select id="filter-section" onchange="renderStudentList()">
              <option value="All">All Sections</option>
              <!-- Options will be loaded dynamically -->
            </select>
          </div>
          <div style="display: flex; gap: 5px; margin-bottom: 2px;">
            <button class="btn-secondary" onclick="sortAlpha()">A-Z</button>
            <button class="btn-secondary" onclick="normalizeNames()">Fix Names</button>
          </div>
        </div>

        <h3>Daily Attendance Logs</h3>
        <div style="overflow-x: auto;">
          <table class="data-table" id="attendance-table">
            <thead>
              <tr>
                <th>LRN</th>
                <th>Name</th>
                <th>Section</th>
                <th>Date</th>
                <th>Time In</th>
                <th>Time Out</th>
                <th>Total Hrs</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- SCORES TAB -->
      <div id="teach-scores" class="dash-content">
        <h3>Grade Student Diary (Max 20 Points)</h3>
        <div class="row">
          <div class="input-group">
            <label>Student LRN</label>
            <input type="text" id="score-lrn" placeholder="123456789012">
          </div>
          <div class="input-group">
            <label>Day Number</label>
            <input type="number" id="score-day" min="1" max="10">
          </div>
        </div>
        
        <div class="rubric-box">
          <h4>Rubrics</h4>
          <div class="input-group">
            <label>Content & Relevance (Max 5)</label>
            <input type="number" id="crit-1" max="5" min="0" placeholder="0-5">
          </div>
          <div class="input-group">
            <label>Grammar & Clarity (Max 5)</label>
            <input type="number" id="crit-2" max="5" min="0" placeholder="0-5">
          </div>
          <div class="input-group">
            <label>Reflection & Insight (Max 5)</label>
            <input type="number" id="crit-3" max="5" min="0" placeholder="0-5">
          </div>
          <div class="input-group">
            <label>Completeness (Max 3)</label>
            <input type="number" id="crit-4" max="3" min="0" placeholder="0-3">
          </div>
          <div class="input-group">
            <label>Punctuality (Max 2)</label>
            <input type="number" id="crit-5" max="2" min="0" placeholder="0-2">
          </div>
        </div>
        <button class="btn-primary" onclick="submitScore()">Submit Score</button>
        <p id="score-msg" class="success-msg"></p>
      </div>

      <!-- ANNOUNCEMENT TAB -->
      <div id="teach-announce" class="dash-content">
        <h3>Post Announcement to All Students</h3>
        <div class="input-group">
          <textarea id="announce-text" rows="5" placeholder="Type your announcement here..."></textarea>
        </div>
        <button class="btn-primary" onclick="postAnnouncement()">Post Announcement</button>
        <p id="announce-success" class="success-msg"></p>
      </div>

    </div>
  </div>

  <script>
    const TEACHER_PASS = 'teacher123'; // Palitan mo ito ng sarili mong password
    const API_URL = '/api/proxy';
    let allRecords = [];
    let studentMap = {};
    let sectionsList = new Set();

    function loginTeacher() {
      const pass = document.getElementById('teacher-pass').value;
      if (pass === TEACHER_PASS) {
        document.getElementById('teacher-auth').classList.remove('active');
        document.getElementById('teacher-dash').classList.add('active');
        loadTeacherData();
      } else {
        document.getElementById('teacher-error').innerText = 'Incorrect password.';
      }
    }

    function logoutTeacher() {
      document.getElementById('teacher-dash').classList.remove('active');
      document.getElementById('teacher-auth').classList.add('active');
      document.getElementById('teacher-pass').value = '';
    }

    function switchTeachTab(tab) {
      document.querySelectorAll('.dash-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.dashboard-tabs .tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`teach-${tab}`).classList.add('active');
      event.target.classList.add('active');
    }

    async function callAPI(action, payload = {}) {
      const res = await fetch(API_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payload })
      });
      return await res.json();
    }

    async function loadTeacherData() {
      // Kunin lahat ng attendance
      const attRes = await callAPI('getAllAttendance');
      // Kunin lahat ng students (para sa pangalan at section)
      const studRes = await callAPI('getSummary');
      
      allRecords = [];
      studentMap = {};
      sectionsList.clear();

      if (studRes.success && studRes.summary) {
        studRes.summary.forEach(s => {
          studentMap[s.lrn] = s;
          if (s.section) sectionsList.add(s.section);
        });
      }

      if (attRes.success && attRes.records) {
        allRecords = attRes.records.reverse();
      }

      // Populate Section Dropdown
      const secFilter = document.getElementById('filter-section');
      secFilter.innerHTML = '<option value="All">All Sections</option>';
      Array.from(sectionsList).sort().forEach(sec => {
        secFilter.innerHTML += `<option value="${sec}">${sec}</option>`;
      });

      renderStudentList();
    }

    function renderStudentList() {
      const searchQuery = document.getElementById('search-student').value.toLowerCase();
      const sectionFilter = document.getElementById('filter-section').value;
      const tbody = document.querySelector('#attendance-table tbody');
      tbody.innerHTML = '';

      let filtered = allRecords.filter(r => {
        const stud = studentMap[r.lrn];
        if (!stud) return false;
        
        // Search Filter
        const fullName = `${stud.lastName}, ${stud.firstName}`.toLowerCase();
        const matchSearch = fullName.includes(searchQuery) || r.lrn.toString().includes(searchQuery);
        
        // Section Filter
        const matchSection = (sectionFilter === 'All') || (stud.section === sectionFilter);

        return matchSearch && matchSection;
      });

      filtered.forEach(r => {
        const stud = studentMap[r.lrn] || { lastName: 'Unknown', firstName: '', section: '-' };
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.lrn}</td>
          <td>${stud.lastName}, ${stud.firstName}</td>
          <td>${stud.section}</td>
          <td>${r.date}</td>
          <td>${r.timeIn || '-'}</td>
          <td>${r.timeOut || '-'}</td>
          <td>${r.totalHours || '0'} hrs</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function sortAlpha() {
      allRecords.sort((a, b) => {
        const nameA = `${studentMap[a.lrn]?.lastName || ''} ${studentMap[a.lrn]?.firstName || ''}`.toLowerCase();
        const nameB = `${studentMap[b.lrn]?.lastName || ''} ${studentMap[b.lrn]?.firstName || ''}`.toLowerCase();
        return nameA.localeCompare(nameB);
      });
      renderStudentList();
    }

    async function normalizeNames() {
      if (!confirm('Ito ay gagawing Title Case ang lahat ng pangalan ng estudyante (e.g. "dela cruz" -> "Dela Cruz"). Sigurado ka ba?')) return;
      
      const res = await callAPI('normalizeNames');
      if (res.success) {
        alert(res.message);
        loadTeacherData(); // I-reload ang data
      } else {
        alert(res.error);
      }
    }

    async function submitScore() {
      const lrn = document.getElementById('score-lrn').value.trim();
      const dayNumber = document.getElementById('score-day').value;
      const c1 = parseInt(document.getElementById('crit-1').value) || 0;
      const c2 = parseInt(document.getElementById('crit-2').value) || 0;
      const c3 = parseInt(document.getElementById('crit-3').value) || 0;
      const c4 = parseInt(document.getElementById('crit-4').value) || 0;
      const c5 = parseInt(document.getElementById('crit-5').value) || 0;
      const total = c1 + c2 + c3 + c4 + c5;
      const criteria = { c1, c2, c3, c4, c5 };
      
      const res = await callAPI('saveScore', { lrn, dayNumber, score: total, criteria });
      if (res.success) {
        document.getElementById('score-msg').innerText = 'Score submitted successfully!';
        setTimeout(() => document.getElementById('score-msg').innerText = '', 3000);
      } else {
        alert(res.error);
      }
    }

    async function postAnnouncement() {
      const text = document.getElementById('announce-text').value;
      const res = await callAPI('saveAnnouncement', { announcement: text });
      if (res.success) {
        document.getElementById('announce-success').innerText = 'Announcement posted!';
        setTimeout(() => document.getElementById('announce-success').innerText = '', 3000);
      }
    }
  </script>
</body>
</html>
